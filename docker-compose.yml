services:
  ocr-backend:
    build:
      context: ./ocr-as-a-service/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5001:5000"
      - "5002:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s